name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acceptance tests (standard library only)
        run: python -m unittest -v
      - name: End-to-end run on sample data
        run: |
          python data/generate_logs.py
          python -m pipeline.ingest
          python -m pipeline.ingest   # second run must insert 0 rows
          python -m pipeline.report
      - name: Container build
        run: docker build -t slo-telemetry-warehouse .
